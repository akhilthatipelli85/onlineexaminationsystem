<!DOCTYPE html>
<html>
<head>
    <title>Online Examination</title>
</head>
<body>
    <h2>Online Examination System</h2>
    <input id="student" placeholder="Student Name">
    <button onclick="login()">Login</button>
    <div id="exam" style="display:none">
        <p>1.HTML stands for?</p>
        <input type="radio" name="q1" value="0"> High Text Machine Language<br>
        <input type="radio" name="q1" value="1"> HyperText Markup Language<br>
        <button onclick="result()">Submit Exam</button>
    </div>
    <p id="output"></p>
    <script>
    function login(){
        let name = document.getElementById("student").value;
        if (name == "") {
            alert("Enter student name");
            return;
        }
        document.getElementById("exam").style.display ="block";
        document.getElementById("output").innerText =
            "Welcome " + name;
    }
    function result(){
        let answer = document.querySelector(
            'input[name="q1"]:checked'
        );
        if (!answer) {
            alert("Select an answer");
            return;
        }
        let score = Number(answer.value);
        document.getElementById("output").innerText =
            "Your score is " + score + "/1";
    }
    </script>
</body>
</html>
